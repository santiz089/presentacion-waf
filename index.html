<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguridad en BD | Usuarios y Contraseñas</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #0a0e14;
  --ink: #e6f1ff;
  --ink2: #8892b0;
  --ink3: #495670;
  --purple: #7000ff;
  --purple-l: #9b51e0;
  --teal: #64ffda;
  --amber: #ffb86c;
  --blue: #8be9fd;
  --red: #ff5555;
  --neon-glow: 0 0 15px rgba(100, 255, 218, 0.4);
  --glass-card: rgba(10, 14, 20, 0.85);
  --glass-surface: rgba(255, 255, 255, 0.03);
  --glass-border: rgba(100, 255, 218, 0.15);
  --glass-border-subtle: rgba(255, 255, 255, 0.05);
  --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
}

html, body { height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh;
  padding: 20px;
  background-color: var(--bg-deep);
  background-image: url('seguridad3.gif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.shell {
  position: relative; z-index: 1;
  width: 100%; max-width: 1280px; 
  background: var(--glass-card);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-radius: 24px; border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
  display: flex; flex-direction: column;
  height: 85vh; 
  min-height: 700px;
  overflow: hidden;
}

.body-wrapper { display: flex; flex: 1; overflow: hidden; }

.sidebar {
  width: 280px;
  background: rgba(0, 0, 0, 0.2);
  border-right: 1px solid var(--glass-border-subtle);
  padding: 24px 16px;
  display: flex; flex-direction: column; gap: 8px;
  overflow-y: auto; flex-shrink: 0;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(100, 255, 218, 0.2); border-radius: 10px; }

.sidebar-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px; letter-spacing: 2px;
  color: var(--teal); font-weight: 700;
  text-transform: uppercase; margin-bottom: 12px; padding-left: 12px;
}
.sb-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px; border-radius: 12px;
  cursor: pointer; transition: all 0.3s ease;
  color: var(--ink2); font-weight: 500; font-size: 13.5px;
  border-left: 3px solid transparent;
}
.sb-item:hover { background: rgba(255, 255, 255, 0.05); }
.sb-item.active {
  background: rgba(100, 255, 218, 0.1); color: var(--teal);
  border-left: 3px solid var(--teal); font-weight: 600;
}
.sb-num {
  font-family: 'DM Mono', monospace; font-size: 11px; opacity: 0.6; font-weight: 600;
  background: rgba(255,255,255,0.05); padding: 4px 6px; border-radius: 6px;
}
.sb-item.active .sb-num { opacity: 1; background: var(--teal); color: var(--bg-deep); box-shadow: var(--neon-glow); }

.main-content { display: flex; flex-direction: column; flex: 1; position: relative; overflow: hidden; }

.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 32px; border-bottom: 1px solid var(--glass-border-subtle);
  background: rgba(0, 0, 0, 0.15); flex-shrink: 0;
}
.slide-id { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--ink2); font-weight: 600; }

.stage { flex: 1; position: relative; overflow: hidden; perspective: 1200px; }

.slide { 
  position: absolute; inset: 0; display: flex; flex-direction: column; 
  padding: 32px 40px; opacity: 0; pointer-events: none; overflow-y: auto; 
}
.slide::-webkit-scrollbar { width: 6px; }
.slide::-webkit-scrollbar-thumb { background: rgba(100, 255, 218, 0.2); border-radius: 10px; }
.slide.active { opacity: 1; pointer-events: all; }

.trans-slideX { transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.25, 1, 0.5, 1); }
.trans-slideX.init-next { transform: translateX(80px); }
.trans-slideX.init-prev { transform: translateX(-80px); }
.trans-slideX.active { transform: translateX(0); }
.trans-slideX.out-next { transform: translateX(-80px); opacity: 0; }
.trans-slideX.out-prev { transform: translateX(80px); opacity: 0; }

.eyebrow { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; font-weight: 600; }
.h1 { font-family: 'Space Grotesk', sans-serif; font-size: 42px; font-weight: 700; line-height: 1.15; margin-bottom: 12px; color: var(--ink); letter-spacing: -0.5px;}
.h2 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--ink); letter-spacing: -0.5px;}
.lead { font-size: 16px; color: var(--ink2); line-height: 1.5; font-weight: 500; margin-bottom: 10px;}

.extra-info {
  background: rgba(100, 255, 218, 0.05); border-left: 3px solid var(--purple);
  padding: 12px 16px; border-radius: 0 10px 10px 0;
  font-size: 14px; color: var(--ink2); line-height: 1.6;
  margin-bottom: 16px; border-top: 1px solid var(--glass-border-subtle); border-right: 1px solid var(--glass-border-subtle); border-bottom: 1px solid var(--glass-border-subtle);
}
.extra-info strong { color: var(--teal); font-weight: 600; }

.example-box {
  background: rgba(112, 0, 255, 0.1); border-left: 4px solid var(--teal);
  border-radius: 6px 12px 12px 6px; padding: 16px; margin-top: 5px;
  color: var(--ink); font-size: 14px; line-height: 1.6;
  transform: translateX(-20px); opacity: 0; transition: transform 0.4s ease, opacity 0.4s ease;
}
.example-box.in { transform: none; opacity: 1; }
.example-title { font-family: 'Space Grotesk', sans-serif; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--teal); font-weight: 700; margin-bottom: 6px; }

.two { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; flex: 1; align-items: start; }
.col-l { display: flex; flex-direction: column; gap: 10px; height: 100%;}

.item {
  padding: 12px 16px; border-radius: 12px; border: 1px solid var(--glass-border-subtle);
  background: var(--glass-surface); backdrop-filter: blur(8px);
  display: flex; gap: 12px; align-items: flex-start;
  transform: translateX(-20px); opacity: 0;
  transition: transform 0.35s ease, opacity 0.35s ease, background 0.3s, border-color 0.3s;
}
.item.in { transform: none; opacity: 1; }
.item:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(100, 255, 218, 0.3); transform: translateY(-2px); }
.ico { width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border-subtle); }
.lbl { font-size: 15px; font-weight: 600; margin-bottom: 2px; color: var(--ink); }
.desc { font-size: 13px; color: var(--ink2); line-height: 1.4; }

.anim-box {
  border-radius: 16px; border: 1px solid var(--glass-border-subtle);
  background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px);
  overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;
  height: 100%; min-height: 300px; padding: 20px; box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
}

.title-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; align-items: start; margin-top: 10px; flex: 1; }
.title-left { display: flex; flex-direction: column; }
.accent-bar { width: 60px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--teal), var(--purple)); margin-bottom: 16px; box-shadow: var(--neon-glow); }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip { font-size: 12px; padding: 6px 14px; border-radius: 50px; border: 1px solid rgba(100, 255, 218, 0.3); color: var(--teal); font-weight: 500; background: rgba(100, 255, 218, 0.05); animation: chip-in 0.5s ease both; }
@keyframes chip-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.integrantes-card { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border-subtle); border-radius: 16px; padding: 20px; margin-top: 20px;}
.int-eyebrow { font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--purple-l); margin-bottom: 14px; font-weight: 600; }
.int-item { display: flex; align-items: center; gap: 10px; font-size: 14.5px; font-weight: 500; color: var(--ink); padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.int-item:last-child { border-bottom: none; }
.int-dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--teal), var(--purple)); flex-shrink: 0; box-shadow: 0 0 8px var(--teal); }

.sum-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; align-content: start; margin-top: 10px; }
.sum-card { padding: 18px; border-radius: 14px; border: 1px solid var(--glass-border-subtle); background: var(--glass-surface); opacity: 0; transform: translateY(15px); transition: opacity 0.3s ease, transform 0.3s ease, border-color 0.3s; }
.sum-card:hover { border-color: var(--teal); background: rgba(100, 255, 218, 0.05); transform: translateY(-3px);}
.sum-card.in { opacity: 1; transform: none; }
.sum-ico { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border-subtle);}
.sum-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 6px; }
.sum-desc { font-size: 13px; color: var(--ink2); line-height: 1.5; }

.ftr { display: flex; align-items: center; justify-content: space-between; padding: 14px 32px; border-top: 1px solid var(--glass-border-subtle); background: rgba(0, 0, 0, 0.2); flex-shrink: 0; }
.btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(100, 255, 218, 0.3); color: var(--teal); padding: 10px 24px; border-radius: 50px; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; transition: all 0.25s; }
.btn:hover:not(:disabled) { background: var(--teal); color: var(--bg-deep); border-color: var(--teal); box-shadow: var(--neon-glow); transform: translateY(-1px); }
.btn:disabled { opacity: 0.3; cursor: default; background: transparent; border-color: var(--glass-border-subtle); color: var(--ink2); }
.kbd-hint { font-size: 12px; color: var(--ink3); font-weight: 500; }

@media (max-width: 768px) {
  body { padding: 10px; }
  .shell { height: 92vh; min-height: 500px; border-radius: 16px; }
  .body-wrapper { flex-direction: column; }
  .sidebar { 
    width: 100%; height: auto; flex-direction: row; flex-wrap: nowrap; 
    overflow-x: auto; overflow-y: hidden; border-right: none; border-bottom: 1px solid var(--glass-border-subtle); 
    padding: 10px; gap: 8px;
  }
  .sidebar::-webkit-scrollbar { height: 4px; }
  .sidebar-title { display: none; }
  .sb-item { white-space: nowrap; padding: 8px 12px; border-left: none; border-bottom: 3px solid transparent; border-radius: 8px; }
  .sb-item.active { border-left: none; border-bottom: 3px solid var(--teal); }
  .two, .title-grid { grid-template-columns: 1fr; gap: 16px; }
  .sum-grid { grid-template-columns: 1fr; }
  .slide { padding: 20px 15px; }
  .h1 { font-size: 28px; }
  .h2 { font-size: 22px; }
  .anim-box { min-height: 200px; padding: 10px; margin-top: 10px; }
  .kbd-hint { display: none; }
}
</style>
</head>
<body>

<div class="shell">
  <div class="body-wrapper">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="hdr">
        <span style="font-weight:600; color:var(--ink2); font-size: 14px;">Seguridad en BD (5.2)</span>
        <span class="slide-id" id="sid">01 / 10</span>
      </div>
      <div class="stage" id="stage"></div>
      <div class="ftr">
        <button class="btn" id="prev" onclick="nav(-1)" disabled>← Anterior</button>
        <span class="kbd-hint">← → teclado · swipe táctil</span>
        <button class="btn" id="next" onclick="nav(1)">Siguiente →</button>
      </div>
    </div>
  </div>
</div>

<script>

function svgAuthVsAuthz() { return `

    exampleBox: 'Si detectas 500 intentos de inicio de sesión fallidos del usuario "admin" en 1 minuto, estás sufriendo un ataque de fuerza bruta.',

  {

/* ─────────────────────────────────────
   MOTOR DE RENDERIZADO 
───────────────────────────────────── */
let cur = 0;
const stage   = document.getElementById('stage');
const sidebar = document.getElementById('sidebar');
const sid     = document.getElementById('sid');
const prevB   = document.getElementById('prev');
const nextB   = document.getElementById('next');

const transitions = ['trans-slideX'];

function buildSidebar() {
  sidebar.innerHTML = '<div class="sidebar-title">TEMARIO 5.2</div>';
  SLIDES.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'sb-item' + (i === cur ? ' active' : '');
    el.onclick = () => goTo(i);
    el.innerHTML = `
      <div class="sb-num">${String(i+1).padStart(2,'0')}</div>
      <div class="sb-text">${s.sidebarTitle}</div>
    `;
    sidebar.appendChild(el);
  });
}

function renderTitle(s) {
  return `
    <div class="eyebrow">${s.eyebrow}</div>
    <div class="h1">${s.h1.replace('\n', '<br>')}</div>
    <div class="accent-bar"></div>
    <p class="lead">${s.lead}</p>
    <div class="extra-info">${s.extraDesc}</div>
    <div class="title-grid">
      <div class="title-left">
        <div class="chip-row">
          ${s.chips.map((c, i) => `<span class="chip" style="animation-delay:${0.28 + i * 0.1}s">${c}</span>`).join('')}
        </div>
        <div style="margin-top:20px">${s.svg()}</div>
      </div>
      <div class="integrantes-card">
        <div class="int-eyebrow">Equipo de trabajo</div>
        ${s.integrantes.map(n => `<div class="int-item"><span class="int-dot"></span>${n}</div>`).join('')}
      </div>
    </div>
  `;
}

function renderItems(s) {
  return `
    <div class="eyebrow">${s.eyebrow}</div>
    <div class="h2">${s.h2}</div>
    <p class="lead">${s.lead}</p>
    <div class="extra-info">${s.extraDesc}</div>
    <div class="two">
      <div class="col-l">
        ${s.items.map(it => `
        <div class="item">
          <div class="ico" style="background:${it.c}">${it.ico}</div>
          <div>
            <div class="lbl">${it.lbl}</div>
            <div class="desc">${it.desc}</div>
          </div>
        </div>`).join('')}
        ${s.exampleBox ? `<div class="example-box"><div class="example-title">💡 Caso de Uso</div><div>${s.exampleBox}</div></div>` : ''}
      </div>
      <div class="anim-box">${s.svg()}</div>
    </div>
  `;
}

function renderSummary(s) {
  return `
    <div class="eyebrow">${s.eyebrow}</div>
    <div class="h2">${s.h2}</div>
    <p class="lead">${s.lead}</p>
    ${s.quote ? `<div class="example-box" style="border-left-color: var(--teal); margin-bottom: 16px;"><div class="example-title" style="color: var(--teal);">🎯 Conclusión</div><div style="font-size: 15px; font-weight: 500; font-style: italic;">${s.quote}</div></div>` : ''}
    <div class="extra-info">${s.extraDesc}</div>
    <div class="sum-grid">
      ${s.sumCards.map((c, i) => `
      <div class="sum-card" style="transition-delay:${i * 0.05}s">
        <div class="sum-ico" style="background:${c.c}">${c.ico}</div>
        <div class="sum-title" style="color:${c.sc}">${c.t}</div>
        <div class="sum-desc">${c.d}</div>
      </div>`).join('')}
    </div>
  `;
}

function goTo(n) {
  const dir = n > cur ? 1 : -1;
  const old = stage.lastElementChild;
  if (old) {
    old.classList.remove('active');
    old.classList.add(dir > 0 ? 'out-next' : 'out-prev');
    setTimeout(() => old.remove(), 600);
  }
  cur = n;
  const s = SLIDES[cur];
  const transClass = transitions[cur % transitions.length];
  const newSlide = document.createElement('div');
  newSlide.className = `slide ${transClass} ${dir > 0 ? 'init-next' : 'init-prev'}`;
  
  if (s.type === 'title') {
    newSlide.style.justifyContent = 'center';
    newSlide.innerHTML = renderTitle(s);
  } else if (s.type === 'summary') {
    newSlide.innerHTML = renderSummary(s);
  } else {
    newSlide.innerHTML = renderItems(s);
  }

  stage.appendChild(newSlide);
  void newSlide.offsetWidth;
  requestAnimationFrame(() => {
    newSlide.classList.remove('init-next', 'init-prev');
    newSlide.classList.add('active');
  });
  
  setTimeout(() => {
    newSlide.querySelectorAll('.item, .sum-card, .example-box').forEach((x, i) => {
      setTimeout(() => x.classList.add('in'), i * 80 + 100);
    });
  }, 150);
  
  sid.textContent = String(cur + 1).padStart(2, '0') + ' / ' + SLIDES.length;
  prevB.disabled = cur === 0;
  nextB.disabled = cur === SLIDES.length - 1;
  nextB.textContent = cur === SLIDES.length - 1 ? 'Fin ✓' : 'Siguiente →';
  buildSidebar();
}

function nav(d) { goTo(Math.min(Math.max(cur + d, 0), SLIDES.length - 1)); }

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) nav(dx < 0 ? 1 : -1);
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nav(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
});

goTo(0);
</script>

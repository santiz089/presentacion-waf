<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Mari</title>
    
    <!-- ── FUENTES ── -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- ── LIBRERÍA THREE.JS PARA LA GALAXIA ── -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
	
    <!-- MEJORA 1: Filtro SVG para distorsión Liquid Glass -->
<svg style="display: none;">
    <filter id="liquid-glass">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>
</svg>

    <!-- ── EFECTOS DE AUDIO ── -->
    <audio id="snd-papel" src="papel.mp3" preload="auto"></audio>
    <audio id="snd-magia" src="magia.mp3" preload="auto"></audio>
    <audio id="snd-confeti" src="confeti.mp3" preload="auto"></audio>

    <!-- ── FONDO DÍA ── -->
    <div class="bg-layer bg-dia active">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="sol"></div>
        <div id="petalos-flotantes"></div>
    </div>

    <!-- ── FONDO NOCHE ── -->
    <div class="bg-layer bg-noche">
        <div class="orb orb-noche-1"></div>
        <div class="orb orb-noche-2"></div>
        <div class="luna"></div>
        <div id="cielo-estrellado"></div>
        <div id="luciernagas"></div>
        
        <!-- ✨ NUEVA: MINI GALAXIA ESPIRAL 3D ✨ -->
        <div id="contenedor-galaxia" class="galaxia-canvas"></div>
    </div>

    <!-- ── CONTROLES ── -->
    <button class="btn-tema" id="btn-tema">🌙 Modo Noche</button>

    <!-- ── ESCENA 3D ── -->
    <div class="camara-cinematografica">
        <div class="tilt-wrapper" id="tilt-wrapper">

            <!-- PANTALLA 1: LOGIN -->
            <div class="pantalla" id="pantalla-login">
                <h1 class="titulo-elegante">Para Ti — Te Quiero</h1>

                <div class="huella-container" id="huella-box">
                    <svg viewBox="0 0 220 260" class="huella-svg" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 20 40 L 20 20 A 20 20 0 0 1 40 20" />
                        <path d="M 180 20 A 20 20 0 0 1 200 40 L 200 40" />
                        <path d="M 20 220 L 20 240 A 20 20 0 0 0 40 240" />
                        <path d="M 180 240 L 200 240 A 20 20 0 0 0 200 220" />
                        <path d="M 30 160 L 30 100 A 80 90 0 0 1 190 100 L 190 160" />
                        <path d="M 44 175 L 44 150 M 44 120 L 44 115 A 66 75 0 0 1 176 115 L 176 175" />
                        <path d="M 58 190 L 58 130 A 52 60 0 0 1 162 130 L 162 135 M 162 165 L 162 190" />
                        <path d="M 72 200 L 72 145 A 38 45 0 0 1 148 145 L 148 200" />
                        <path d="M 86 210 L 86 190 M 86 170 L 86 160 A 24 30 0 0 1 134 160 L 134 210" />
                        <path d="M 100 215 L 100 175 A 10 15 0 0 1 120 175 L 120 215" />
                        <path d="M 100 225 L 110 215 L 120 225" />
                        <path d="M 105 230 L 110 225 L 115 230" />
                    </svg>
                    <div class="scan-ring" id="scan-ring"></div>
                    <div class="latido-ring"></div>
                    <div class="escaner-laser" id="escaner-laser"></div>
                    <div class="scan-particles" id="scan-particles"></div>
                    <svg class="check-aprobado" viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="26" cy="26" r="21"/>
                        <path d="M15 27 L22 34 L37 18"/>
                    </svg>
                </div>

                <input type="password" id="input-password" class="input-pass-glass" placeholder="Introduce la contraseña">
                <p class="estado-login" id="estado-login">Tu eres la llave mágica</p>
                <div class="login-dots" id="login-dots">
                    <div class="login-dot" id="dot-1"></div>
                    <div class="login-dot" id="dot-2"></div>
                    <div class="login-dot" id="dot-3"></div>
                    <div class="login-dot" id="dot-4"></div>
                </div>
            </div>

            <!-- PANTALLA 2: SOBRE -->
            <div class="pantalla oculto" id="pantalla-sobre">
                <div class="sobre-3d" id="sobre-3d">

                    <!-- Frente del Sobre -->
                    <div class="cara-frente">
                        <div class="fecha-sobre">JUNIO · 2026</div>
                        <div class="corazon-miniatura">❤</div>
                        <p class="pie-foto">Toca para abrir tu sorpresa</p>
                    </div>

                    <!-- Dorso del Sobre -->
                    <div class="cara-dorso" id="cara-dorso">
                        
                        <!-- CARTA CON GLASSMORPHISM -->
                        <div class="carta-glass" id="carta">
                            <div class="carta-top">
                                <button class="btn-cerrar" id="btn-cerrar">✕</button>
                                CONFIDENCIAL
                            </div>
                            <h2 class="titulo-carta">Feliz Aniversario</h2>
                            <h3 class="saludo-carta">Mi Amor,</h3>
                            
                            <p class="carta-texto" id="texto-maquina"></p>
                            
                            <!-- FIRMA Y FLORES -->
                            <div class="carta-corazon-final">
                                <div class="firma-contenedor" id="firma-contenedor">
                                    <div class="tooltip-ramo" id="tooltip-ramo"></div>
                                    
                                    <!-- Imagen de Snoopy añadida sin interactividad -->
                                    <img src="snoopy.gif" alt="Snoopy" class="snoopy-gif">
                                    
                                    <img src="rosas.png" alt="Rosas" class="flores-sello" id="ramo-interactivo">
                                    <span class="nombre-firma">Santiz</span>
                                    
                                    <!-- ❤️ CORAZÓN INTERACTIVO SVG ❤️ -->
                                    <div class="corazon-firma-wrapper" id="corazon-firma-wrapper">
                                        <div class="corazon-glow"></div>
                                        <svg class="corazon-latido-svg" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M16 28.5l-2.15-1.95C6.2 20.65 2 16.55 2 11.5 2 7.35 5.35 4 9.5 4c2.35 0 4.6.6 6.5 2.1C17.9 4.6 20.15 4 22.5 4c4.15 0 7.5 3.35 7.5 7.5 0 5.05-4.2 9.15-11.85 15.1L16 28.5z"/>
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- ETIQUETAS RESTAURADAS QUE SE HABÍAN BORRADO -->
                            <p class="dias-juntos" id="dias-juntos"></p>
                        </div> 

                        <div class="sobre-aleta-izq"></div>
                        <div class="sobre-aleta-der"></div>
                        <div class="sobre-aleta-inf"></div>
                        <div class="sobre-aleta-sup" id="aleta-sup">
                            <div class="sello-sobre" id="sello-sobre">❤</div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
